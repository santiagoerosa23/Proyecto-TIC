<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/style.css">
    <title>TIC EXPERIENCE: SHOWCASE</title>
</head>

<body>

    <nav class="horizontal">
        <section class="nav-izquierda">
            <a href="index.html" class="inicio-link">
                <img src="/Assets/logo.png" alt="Logo" class="logo">
            </a>
    
            <section class="search-container horizontal">
                <img src="/Assets/search.png" alt="Search Icon" class="search-icon">
                <input type="text" placeholder="Busca un proyecto" class="search-input">
            </section>
        </section>
    
        <section class="nav-derecha">
            <a class="navbar-guest boton navbar" href="login.html">Iniciar sesión</a>
            <a class="mis-proyectos boton navbar" href="/perfil.html" hidden>Mis proyectos</a>
            <div class="dropdown navbar-profile" hidden>
                <button type="button" class="login-btn">
                    <img src="/Assets/perfil.svg?v=2" alt="Perfil de usuario" class="login-img">
                </button>
    
                <div class="dropdown-content">
                    <div class="dropdown-header">
                        <div class="usuario-icono-drpdw"></div>
    
                        <div class="info-drpdw">
                            <span class="nombre-usuario">Nombre de usuario</span>
                            <span class="uduario-@">@nombredeusuario</span>
                        </div>
                    </div>
    
                    <hr class="divisor-dropdown">
    
                    <a href="/perfil.html" class="perfil-dropdown">Ver perfil</a>
                    <a href="login.html" class="cerrar-sesion-dropdown">Cerrar sesión</a>
                </div>
            </div>
        </section>
    </nav>
    
    <script src="/js/config.js"></script>
    <script src="/js/navbar.js"></script>
    <footer>
        <section class="footer-left">
            <img src="/Assets/logo.png" alt="Logo" class="logo-footer">
        </section>

        <section class="footer-right">
            <a href="https://campus.ort.edu.ar/" target="_blank" class="ort-link">
                <img src="/Assets/ort-logo.png" alt="ORT Logo" class="ort-logo">
            </a>
            <a href="https://www.instagram.com/ort.tic" target="_blank" class="instagram-link">
                <img src="/Assets/Instagram.svg" alt="Instagram Logo" class="Instagram-logo">
            </a>
        </section>
    </footer>
</body>

</html>
