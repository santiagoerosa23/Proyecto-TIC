<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="login.css">
    <title>Wireframe de Login</title>
</head>
<body class="wf-body">
    <div class="wf-container">
        <div class="wf-logo">
        </div>
        <div class="wf-derecha">
             <form onsubmit="return false;">
                <div class="wf-usuario">
                    <span class="wf-ingresar">Ingresar Usuario / Contraseña</span>
                </div>
                <button class="wf-continuar">Continuar</button>
            </form>

            <div class="wf-divider"></div>
            <div class="wf-formas">
                <div class="wf-google">Google</div>
                <div class="wf-apple">Apple</div>
                <div class="wf-github">GitHub</div>
            </div>
            
            <a href="../Index.html" class="wf-volver">Volver</a>
        </div>
    </div>

</body>
</html>
