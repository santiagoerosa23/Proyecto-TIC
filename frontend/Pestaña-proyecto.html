<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/style.css">
    <title>TIC EXPERIENCE: SHOWCASE</title>
</head>

<body>
    <nav class="horizontal">
        <section class="nav-izquierda">
            <img src="/Assets/logo.png" alt="Logo" class="logo">
            <section class="search-container horizontal">
                <img src="/Assets/search.png" alt="Search Icon" class="search-icon">
                <input type="text" placeholder="Busca un proyecto" class="search-input">
            </section>
        </section>
        <section class="nav-derecha">
            <button class="login boton">
                <a href="login.html">
                    Iniciar sesión
                </a>
            </button>
            <section class="logged-in">
                <button class="boton">
                    <a href="#">
                        Mis proyectos
                    </a>
                </button>
                <div class="perfil">
                    <img src="/Assets/perfil.svg" alt="Perfil del creador" class="perfil-img icono">
                </div>
            </section>
        </section>
    </nav>
    <div class="info">
        <div class="infoleft">
            <div class="perfil">
                <img src="/Assets/perfil.svg" alt="Perfil del creador" class="perfil-img icono ">
            </div>
            <h1 class="tituloProyecto">lorem ipsum</h1>
        </div>
        <div class="inforight">
            <div class="corazon icono">
                <img src="/Assets/corazon-vacio.svg" alt="Me gusta" class="corazon-vacio-img">
            </div>
            <div class="guardar icono">
                <img src="/Assets/Guardar.svg" alt="Guardar proyecto" class="guardar-img">
            </div>
        </div>
    </div>
    <div class="caja-proyecto">
        <div class="contenido">
            <div class="center">
                <div class="vertical">
                    <div class="foto"></div>
                    <p class="texto">Lorem ipsum dolor sit amet consectetur adipisicing elit. Possimus earum sequi natus
                        sed
                        placeat consequuntur sit minus rerum nihil nulla animi ratione recusandae, necessitatibus vero
                        molestias
                        sapiente autem? Nobis, fugiat.</p>
                    <div class="foto"></div>
                </div>
            </div>
        </div>
    </div>
    <footer>
        <section class="footer-left">
            <img src="/Assets/logo.png" alt="Logo" class="logo-footer">
        </section>

        <section class="footer-right">
            <a href="https://campus.ort.edu.ar/" target="_blank" class="ort-link">
                <img src="/Assets/ort-logo.png" alt="ORT Logo" class="ort-logo">
            </a>
            <a href="https://www.instagram.com/ort.tic" target="_blank" class="instagram-link">
                <img src="/Assets/Instagram.svg" alt="Instagram Logo" class="Instagram-logo">
            </a>
        </section>
    </footer>
</body>

</html>
