<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/publicar.css">
    <title>Crear proyecto - TIC EXPERIENCE</title>
</head>

<body>
    <main class="publicar-container">
        <form id="formularioProyecto" class="formulario-proyecto">
            <h1>CONFIGURÁ TU PROYECTO</h1>

            <label for="titulo">Título</label>
            <input id="titulo" name="titulo" type="text" placeholder="Título" required>

            <div id="listaIntegrantes" class="lista-integrantes"></div>

            <p class="mensaje-formulario" id="mensajeFormulario" role="status"></p>

            <div class="acciones-proyecto">
                <button class="boton continuar-proyecto" type="submit">IR AL EDITOR</button>
                <a class="volver-proyecto" href="/Index.html">Volver al inicio</a>
            </div>
        </form>

        <section class="vista-logo">
            <img src="/Assets/logo.png" alt="TIC EXPERIENCE">
        </section>
    </main>

    <script src="/js/config.js"></script>
    <script src="/js/publicar.js"></script>
</body>

</html>
