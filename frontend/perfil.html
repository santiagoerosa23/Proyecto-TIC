
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil de usuario - TIC EXPERIENCE</title>

    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/perfil.css">
</head>

<body>


    <nav class="horizontal">
        <section class="nav-izquierda">
            <a href="index.html" class="inicio-link">
                <img src="/Assets/logo.png" alt="Logo" class="logo">
            </a>
    
            <section class="search-container horizontal">
                <img src="/Assets/search.png" alt="Search Icon" class="search-icon">
                <input type="text" placeholder="Busca un proyecto" class="search-input">
            </section>
        </section>
    
        <section class="nav-derecha">
            <div class="dropdown">
                <button type="button" class="login-btn">
                    <img src="/Assets/perfil.webp" alt="Perfil de usuario" class="login-img">
                </button>
    
                <div class="dropdown-content">
                    <div class="dropdown-header">
                        <div class="usuario-icono-drpdw"></div>
    
                        <div class="info-drpdw">
                            <span class="nombre-usuario">Nombre de usuario</span>
                            <span class="uduario-@">@nombredeusuario</span>
                        </div>
                    </div>
    
                    <hr class="divisor-dropdown">
    
                    <a href="/perfil.html" class="perfil-dropdown">Ver perfil</a>
                    <a href="/logout.html" class="cerrar-sesion-dropdown">Cerrar sesión</a>
                </div>
            </div>
        </section>
    </nav>
    

    <main class="perfil-container">

        <section class="informacion-usuario">

            <div class="foto-usuario">
                <img src="/Assets/perfil.webp" alt="Foto de perfil">
            </div>

            <div class="datos-usuario">
                <h1>Nombre de usuario</h1>

                <p class="descripcion">
                    Descripción del usuario
                </p>
            </div>

            <button class="boton-foto-perfil">
                Subir foto de perfil
            </button>

        </section>

        <section class="proyectos">

            <h2>Proyectos publicados</h2>

            <div class="proyectos-publicados">

                <a href="/publicar.html" class="proyecto">
                    <div class="imagen-proyecto-1">
                        <img src="/Assets/proyecto2.png" alt="Proyecto 1">
                    </div>

                    <div class="barra-negra">
                        <h3>Nombre del proyecto</h3>
                    </div>
                </a>

                <a href="/publicar.html" class="proyecto">
                    <div class="imagen-proyecto-2">
                        <img src="/Assets/proyecto2.png" alt="Proyecto 2">
                    </div>

                    <div class="barra-negra">
                        <h3>Nombre del proyecto</h3>
                    </div>
                </a>

                <a href="/publicar.html" class="proyecto">
                    <div class="imagen-proyecto-3">
                        <img src="/Assets/proyecto3.jpg" alt="Proyecto 3">
                    </div>

                    <div class="barra-negra">
                        <h3>Nombre del proyecto</h3>
                    </div>
                </a>

            </div>

        </section>

    </main>

    <footer>
        <section class="footer-left">
            <img src="/Assets/logo.png" alt="Logo" class="logo-footer">
        </section>

        <section class="footer-right">
            <a
                href="https://campus.ort.edu.ar/"
                target="_blank"
                rel="noopener noreferrer"
                class="ort-link"
            >
                <img src="/Assets/ort-logo.png" alt="ORT Logo" class="ort-logo">
            </a>

            <a
                href="https://www.instagram.com/ort.tic"
                target="_blank"
                rel="noopener noreferrer"
                class="instagram-link"
            >
                <img
                    src="/Assets/Instagram.svg"
                    alt="Instagram"
                    class="Instagram-logo"
                >
            </a>
        </section>
    </footer>

</body>

</html>
