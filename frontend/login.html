<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/login.css">
    <title>TIC EXPERIENCE: Login</title>
</head>
<body class="wf-body">
        <div class="wf-container">
        <div class="wf-logo">
            <img src="/Assets/logo.png" class="img-logo">
        </div>
        <div class="wf-derecha">
            <form action="procesar_login.php" method="POST" id="login">
                <h2>Iniciar sesión</h2>
              
                <label for="usuario">DNI:</label>
                <input type="text" id="usuario" name="usuario" placeholder="Ingresá tu DNI" inputmode="numeric" required>
                
                <label for="password">Contraseña:</label>
                <input type="password" id="password" name="password" placeholder="Ingresá tu contraseña" required>
                
                <button type="submit" class="wf-continuar">Continuar</button> 

                  <a href="javascript:void(0);" class="wf-volver" onclick="history.back()">Volver</a>
            </form>
      
            
          

        </div>
    </div>
</div>
<script src="js/config.js"></script>
<script src="js/login.js"></script>
</body>
</html>
