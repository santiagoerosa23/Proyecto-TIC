<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/login.css">
    <title>Wireframe de Login</title>
</head>
<body class="wf-body">
    <div class="wf-container">
        <div class="wf-logo">
        </div>
        <div class="wf-derecha">
            <form action="procesar_login.php" method="POST">
                <h2>Iniciar sesión</h2>
              
                <label for="usuario">Correo electrónico o usuario:</label>
                <input type="text" id="usuario" name="usuario" placeholder="ejemplo@correo.com" required>
                
                <label for="password">Contraseña:</label>
                <input type="password" id="password" name="password" required>
                
                <button type="submit" class="wf-continuar">Continuar</button> 
                
            </form>
        </div>
        

            <div class="wf-divider"></div>
            <div class="wf-formas">
                <div class="wf-google">Google</div>
                <div class="wf-apple">Apple</div>
                <div class="wf-github">GitHub</div>
            </div>
            
            <a href="../Index.html" class="wf-volver">Volver</a>
        </div>
    </div>

</body>
</html>
