<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/login.css">
    <title>Wireframe de Login</title>
</head>
<body class="wf-body">
    <!-- Santi porfavor mejora el diseño no puede a esta etapa con una semana restante quedar asi el login -->
    <div class="wf-container">
        <div class="wf-logo">
        </div>
        <div class="wf-derecha">
            <form action="procesar_login.php" method="POST" id="login">
                <h2>Iniciar sesión</h2>
              
                <label for="usuario">Correo electrónico o usuario:</label>
                <input type="text" id="usuario" name="usuario" placeholder="ejemplo@correo.com" required>
                
                <label for="password">Contraseña:</label>
                <input type="password" id="password" name="password" required>
                
                <button type="submit" class="wf-continuar">Continuar</button> 
                
            </form>
      
        

            <div class="wf-divider"></div>
            
            <a href="javascript:void(0);" class="wf-volver" onclick="history.back()">Volver</a>

        </div>
    </div>
</div>
<script src="js/login.js"></script>
</body>
</html>
