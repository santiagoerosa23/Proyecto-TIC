<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TIC Experience - Editor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/editor.css">
</head>
<body>

  <div class="app-container">
    <!-- Barra superior / Header -->
    <header class="navbar">
      <div class="logo">
        <span class="logo-accent">TIC</span>
        <span class="logo-text">experience</span>
      </div>

      <div class="navbar-actions">
        <button class="btn btn-primary">Enviar a revisión</button>
        <button class="btn btn-secondary">Guardar</button>
      </div>
    </header>

    <!-- Área principal de trabajo -->
    <div class="workspace">
      
      <!-- Panel Izquierdo: Elementos / Contenido -->
      <aside class="sidebar sidebar-left">
        <h2 class="sidebar-title">Contenido</h2>
        
        <div class="tool-grid">
          <button class="tool-card">
            <span class="tool-icon">Aa</span>
            <span class="tool-label">Texto</span>
          </button>
          <button class="tool-card">
            <span class="tool-icon">IMG</span>
            <span class="tool-label">Imagen</span>
          </button>
          <button class="tool-card">
            <span class="tool-icon">—</span>
            <span class="tool-label">Divisor</span>
          </button>
          <button class="tool-card">
            <span class="tool-icon">▶</span>
            <span class="tool-label">Video</span>
          </button>
        </div>

        <span class="section-label">Layout</span>

        <div class="layout-list">
          <button class="tool-card tool-card-full">
            <span class="tool-icon">▢</span>
            <span class="tool-label">Contenedor</span>
          </button>
          <button class="tool-card tool-card-full">
            <span class="tool-icon">≡</span>
            <span class="tool-label">Fila</span>
          </button>
          <button class="tool-card tool-card-full">
            <span class="tool-icon rotate-90">≡</span>
            <span class="tool-label">Columna</span>
          </button>
        </div>
      </aside>

      <!-- Lienzo principal / Canvas -->
      <main class="canvas-area">
        <div class="canvas-card">
          <h1 class="canvas-card-title">Título de ejemplo</h1>
          <p class="canvas-card-text">Así se ve el contenido que se edita en el canvas.</p>
        </div>
      </main>

      <!-- Panel Derecho: Propiedades -->
      <aside class="sidebar sidebar-right">
        <h2 class="sidebar-title">Propiedades</h2>

        <div class="property-group">
          <label class="property-label">Contenido</label>
          <div class="property-input">Texto de ejemplo</div>
        </div>

        <div class="property-group">
          <label class="property-label">Tamaño (px)</label>
          <div class="property-input">16</div>
        </div>

        <div class="property-group">
          <label class="property-label">Tipografía</label>
          <div class="property-input">Inter Regular</div>
        </div>

        <div class="property-group">
          <label class="property-label">Alinear</label>
          <div class="align-controls">
            <button class="align-btn active" title="Izquierda">
              <svg width="18" height="12" viewBox="0 0 18 12" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="0" y1="2" x2="18" y2="2"/>
                <line x1="0" y1="6" x2="12" y2="6"/>
                <line x1="0" y1="10" x2="15" y2="10"/>
              </svg>
            </button>
            <button class="align-btn" title="Centro">
              <svg width="18" height="12" viewBox="0 0 18 12" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="0" y1="2" x2="18" y2="2"/>
                <line x1="3" y1="6" x2="15" y2="6"/>
                <line x1="1.5" y1="10" x2="16.5" y2="10"/>
              </svg>
            </button>
            <button class="align-btn" title="Derecha">
              <svg width="18" height="12" viewBox="0 0 18 12" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="0" y1="2" x2="18" y2="2"/>
                <line x1="6" y1="6" x2="18" y2="6"/>
                <line x1="3" y1="10" x2="18" y2="10"/>
              </svg>
            </button>
            <button class="align-btn" title="Justificar">
              <svg width="18" height="12" viewBox="0 0 18 12" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="0" y1="2" x2="18" y2="2"/>
                <line x1="0" y1="6" x2="18" y2="6"/>
                <line x1="0" y1="10" x2="18" y2="10"/>
              </svg>
            </button>
          </div>
        </div>

        <div class="spacer"></div>

        <button class="btn btn-danger">Borrar</button>
      </aside>

    </div>
  </div>

</body>
</html>
