<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/style.css">
    <title>TIC EXPERIENCE: EDITOR</title>
</head>

<body>
    <nav class="horizontal">
        <section class="nav-izquierda">
            <a href="Index.html" class="inicio-link">
                <img src="/Assets/logo.png" alt="Logo" class="logo">
            </a>
        </section>
        <section class="nav-derecha">
            <button class="boton revision">
                Enviar a revisión
            </button>
            <button class="boton guardar">
                Guardar
            </button>
        </section>
    </nav>

    <main class="editor">
        <aside class="panel panel-izquierda">
            <h2 class="panel-titulo">Contenido</h2>

            <div class="cuadricula-herramientas">
                <button class="herramienta">
                    <span class="herramienta-icono">Aa</span>
                    <span class="herramienta-texto">Texto</span>
                </button>
                <button class="herramienta">
                    <span class="herramienta-icono">IMG</span>
                    <span class="herramienta-texto">Imagen</span>
                </button>
                <button class="herramienta">
                    <span class="herramienta-icono">—</span>
                    <span class="herramienta-texto">Divisor</span>
                </button>
                <button class="herramienta">
                    <span class="herramienta-icono">▶</span>
                    <span class="herramienta-texto">Video</span>
                </button>
            </div>

            <span class="etiqueta">Layout</span>

            <div class="lista-layout">
                <button class="herramienta">
                    <span class="herramienta-icono">▢</span>
                    <span class="herramienta-texto">Contenedor</span>
                </button>
                <button class="herramienta">
                    <span class="herramienta-icono">≡</span>
                    <span class="herramienta-texto">Fila</span>
                </button>
                <button class="herramienta">
                    <span class="herramienta-icono girado-90">≡</span>
                    <span class="herramienta-texto">Columna</span>
                </button>
            </div>
        </aside>

        <section class="lienzo">
            <div class="caja-lienzo">
                <h1 class="tituloProyecto-lienzo">Título de ejemplo</h1>
                <p class="texto-lienzo">Así se ve el contenido que se edita en el lienzo.</p>
            </div>
        </section>

        <aside class="panel panel-derecha">
            <h2 class="panel-titulo">Propiedades</h2>

            <div class="form-group">
                <label for="propiedadContenido">Contenido</label>
                <input type="text" id="propiedadContenido" name="propiedadContenido" value="Texto de ejemplo">
            </div>

            <div class="form-group">
                <label for="propiedadTamano">Tamaño (px)</label>
                <input type="number" id="propiedadTamano" name="propiedadTamano" value="16">
            </div>

            <div class="form-group">
                <label for="propiedadTipografia">Tipografía</label>
                <select id="propiedadTipografia" name="propiedadTipografia">
                    <option value="arial">Arial</option>
                    <option value="verdana">Verdana</option>
                    <option value="times">Times New Roman</option>
                    <option value="courier">Courier New</option>
                    </select>
            </div>

            <div class="form-group">
                <label>Alinear</label>
                <div class="botones-alinear horizontal">
                    <button class="boton-alinear activo" title="Izquierda">
                        <img src="/Assets/alinear-izquierda.svg" alt="Alinear a la izquierda" class="alinear-icono">
                    </button>
                    <button class="boton-alinear" title="Centro">
                        <img src="/Assets/alinear-centro.svg" alt="Alinear al centro" class="alinear-icono">
                    </button>
                    <button class="boton-alinear" title="Derecha">
                        <img src="/Assets/alinear-derecha.svg" alt="Alinear a la derecha" class="alinear-icono">
                    </button>
                    <button class="boton-alinear" title="Justificar">
                        <img src="/Assets/alinear-justificar.svg" alt="Justificar" class="alinear-icono">
                    </button>
                </div>
            </div>

            <button class="boton borrar">
                Borrar
            </button>
        </aside>
    </main>

</body>

</html>
